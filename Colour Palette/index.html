<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Color Palette</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <header>
            <h1>Color Palette Generator</h1>
            <button class="generator-btn" id="generateBtn">
                <i class="fa-solid fa-rotate"></i> Generate
            </button>
        </header>

        <section class="color-palette" id="palette">
            <!-- // color-box 1 -->

            <article class="color-box">
                <div class="box" style="background-color: #6665e3;"></div>
                <div class="color-info">
                    <span class="hex-value">#6665E3</span>
                    <i class="fa-solid fa-copy"></i>
                </div>
            </article>
