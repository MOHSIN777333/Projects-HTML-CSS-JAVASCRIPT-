<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="./CSS/login.css">
</head>

<body>
    <div class="auth-container">
        <h2>Reset Password 🔐</h2>
        <p style="color:#aaa; text-align:center">
            Email dalo — reset link bhejte hain!
        </p>

        <form id="forgotForm">
            <input type="email" id="email" placeholder="Email" />
            <button type="submit" id="submitBtn">Send Reset Link</button>
        </form>

        <p id="successMsg" style="color:#4ade80; text-align:center"></p>
        <p id="errorMsg" class="error"></p>

        <p><a href="login.html">← Wapas Login</a></p>
    </div>
    <script type="module" src="./supaBase/config/auth.js"></script>
</body>

</html>
